[project]
name = "template-service"
version = "0.1.0"
description = "Template Service API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<0.200",
    "scalar-fastapi>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "polyfactory>=2.0,<4.0",
    "httpx>=0.27,<1.0",
]
dev = [
    "template-service[test]",
    "ruff>=0.8,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_tests.py", "*_feature.py"]
python_classes = ["*Tests", "*Feature"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["template_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI's Depends()-in-defaults idiom
    "S101",  # asserts are how pytest works
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["template_service", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["template_service", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["template_service"]
