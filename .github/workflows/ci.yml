name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements-dev.lock

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage.xml

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health-dashboard-service
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Apply migrations (up, then down, then up)
        working-directory: app/migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://postgres:postgres@localhost:5432/health-dashboard-service?sslmode=disable
          GOOSE_MIGRATION_DIR: .
        run: |
          goose up
          goose down-to 0
          goose up

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health-dashboard-service
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: health-dashboard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm -d --name smoke --network host \
            -e PG_HOST=127.0.0.1 -e PG_PORT=5432 -e PG_USER=postgres \
            -e PG_PASSWORD=postgres -e PG_DATABASE=health-dashboard-service \
            health-dashboard-api:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/health/ready
          docker logs smoke
          docker rm -f smoke
